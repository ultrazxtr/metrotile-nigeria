<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - MetroTile Nigeria Ltd</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-50">

    <!-- NAV BAR - Copy from index.html -->
    <nav class="bg-white shadow sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 bg-red-700 rounded-2xl flex items-center justify-center text-white font-bold text-3xl">MT</div>
                <span class="text-3xl font-bold">MetroTile</span>
            </div>
            <div class="hidden md:flex gap-10 text-lg">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="products.html">Products</a>
                <a href="services.html">Services</a>
                <a href="gallery.html">Gallery</a>
                <a href="contact.html">Contact</a>
            </div>
            <a href="tel:08033633964" class="bg-red-700 text-white px-8 py-4 rounded-2xl font-semibold">0803 363 3964</a>
        </div>
    </nav>

    <div class="max-w-2xl mx-auto px-6 py-24">
        <h1 class="text-5xl font-bold text-center mb-12">Get a Quote</h1>
        
        <form action="https://formsubmit.co/siyakaoimisi10@gmail.com" method="POST" class="bg-white p-10 rounded-3xl shadow-xl space-y-8">
            <input type="hidden" name="_subject" value="New Quote Request - MetroTile">
            
            <div>
                <label class="block mb-2 font-medium">Full Name *</label>
                <input type="text" name="name" required class="w-full px-6 py-5 border rounded-2xl focus:border-red-700">
            </div>
            
            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="block mb-2 font-medium">Phone Number *</label>
                    <input type="tel" name="phone" required class="w-full px-6 py-5 border rounded-2xl focus:border-red-700">
                </div>
                <div>
                    <label class="block mb-2 font-medium">Email *</label>
                    <input type="email" name="email" required class="w-full px-6 py-5 border rounded-2xl focus:border-red-700">
                </div>
            </div>

            <div>
                <label class="block mb-2 font-medium">Full Address</label>
                <input type="text" name="address" class="w-full px-6 py-5 border rounded-2xl focus:border-red-700" placeholder="Plot 623, Cadastral Zone BO2, Abuja">
            </div>

            <div>
                <label class="block mb-2 font-medium">Project Details</label>
                <textarea name="message" rows="6" class="w-full px-6 py-5 border rounded-3xl focus:border-red-700" placeholder="Tell us about your roofing project..."></textarea>
            </div>

            <button type="submit" class="w-full bg-red-700 text-white py-7 rounded-3xl text-2xl font-semibold hover:bg-red-800 transition">
                Send Quote Request
            </button>
        </form>
    </div>

    <!-- WhatsApp -->
    <a href="https://wa.me/2348033633964" target="_blank" class="fixed bottom-8 right-8 bg-green-500 w-16 h-16 rounded-full flex items-center justify-center text-4xl text-white shadow-2xl z-50">📱</a>
</body>
</html>
